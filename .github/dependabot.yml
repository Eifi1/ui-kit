# Monthly GitHub Actions updates for @eifi1/ui-kit — the apps' convention:
#   - npm version updates left Dependabot on 2026-10-16 (Marcel, as keksdose's): the
#     pre-push hook's scripts/check-dependencies.mjs blocks a push on an open Dependabot
#     alert and lists newer minor/patch versions. GitHub keeps raising alerts and
#     security updates for npm.
#   - MONTHLY at 06:00 Zurich; `ci(deps): …` (hidden in .versionrc.cjs, so an update
#     never cuts a release on its own); minor and patch grouped; NO majors (Marcel,
#     2026-09-26, harmonised across the repos).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    # A push to main no longer rebases open Dependabot PRs (each rebase was a full CI run;
    # keksdose's measurement, 2026-10-16). Rebase one by hand with `@dependabot rebase`.
    rebase-strategy: disabled
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
