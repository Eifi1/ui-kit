# Aligned with keksdose, kastlan and lenkbank (Eifi1/shared-workflows conventions).
#
# Monthly, grouped: one PR for all minor/patch bumps. `build` / `ci`
# prefixes are hidden changelog types, so a bump never cuts a release on its own, and
# they pass the Conventional Commits check.
#
# Majors are never proposed (see the npm `ignore` below): this package's PEER ranges
# define what the three apps may install, and every major has been a migration.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zurich
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # No majors, for ANY package: a major is a migration (vite 8, eslint 10, TypeScript 7,
    # vitest 5 all broke CI when Dependabot proposed them), done by hand on a branch
    # with adoption notes where it touches the peer ranges. Every PR also costs a CI
    # run, so proposing what we would close anyway is waste.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zurich
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
