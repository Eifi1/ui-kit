name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# LOCAL FIRST. CI only CONFIRMS what `npm run check` already proved on the machine that
# pushed: the husky pre-push hook runs the very same script, and every check lives in
# an npm script (see package.json → "check") rather than as an inline step here, so the
# two cannot drift. What each check guards is documented in its script:
#   typecheck · lint · check:tokens · test:coverage (the coverage ratchet in
#   vitest.config.ts) · build · check:graph (one module per source file, so
#   `sideEffects` still tree-shakes recharts) · check:package (installs the packed
#   tarball and imports every entry point by name) · build:showcase · check:tailwind
#   (the documented @source scan reaches the package) · check:security (npm audit,
#   high) · check:commits (Conventional Commits over the pushed range).
jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole range, so check:commits can read every message in it
      # Node from .nvmrc (24.19.0), the file the apps pin too. Not 20: jsdom 30 pulls
      # undici, which calls `webidl.util.markAsUncloneable` — added in Node 20.18 — and
      # on plain 20 every test file dies with "Failed to start forks worker".
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
