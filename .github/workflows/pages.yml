name: Showcase

# Publishes the component showcase to GitHub Pages — the showcase CI already BUILT for
# this commit, once CI is green. Nothing is installed or built here, and a commit whose
# CI failed is never deployed (this used to rebuild in parallel with CI and deploy
# regardless of its result).
#
# A design system that three apps derive from should be readable without a
# checkout: ADOPTING.md is handed to a new consumer's agent, and "see the
# components" currently means "clone the repo and run a dev server".
#
# ONE MANUAL STEP this workflow cannot do for you:
#   repo Settings → Pages → Source: "GitHub Actions"
# Until that is set, the deploy step fails with a 404 from the Pages API.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "A successful CI run on main whose showcase artifact to deploy"
        required: true

permissions:
  contents: read
  actions: read # download the artifact from the CI run
  pages: write
  id-token: write

# Never cancel an in-flight deploy — a cancelled one can leave the site half
# published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the showcase CI built
    # A workflow_run fires for every completed CI run; only a green push to main deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: showcase
          path: site
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
