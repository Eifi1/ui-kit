name: Release

# STAGES @eifi1/ui-kit on npmjs.com when a v* tag is pushed; a maintainer then
# approves the staged version with their 2FA before it goes live:
#
#   npm version patch|minor|major && git push --follow-tags
#   → this workflow stages it →  npm stage list @eifi1/ui-kit
#                                npm stage approve <stage-id>   (or on npmjs.com)
#
# Authentication is npm TRUSTED PUBLISHING (OIDC), configured on npmjs.com for
# Eifi1/ui-kit + release.yml with direct publishing NOT allowed — so no npm token
# lives in this repository, and nothing that can push a tag can release a version
# without the maintainer's second factor. It replaced an NPM_TOKEN secret when npm
# stopped letting tokens bypass 2FA for publishing (the 0.5.0 run failed EOTP).
#
# The package is public, so npm's free tier covers it and consumers need no
# auth at all — which is the point of moving off the `file:` submodule.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) and provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24, not 20, and not by preference: jsdom 30 pulls undici, which calls
      # `webidl.util.markAsUncloneable` — added to Node in 20.18. On plain 20 every
      # test file dies before it runs with "Failed to start forks worker" and a
      # TypeError from inside CacheStorage, which names neither jsdom nor the Node
      # version. It is also what all four consumers build this package with (their
      # .nvmrc is 24.19.0), so testing it on anything else tests something nobody
      # ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Refuse to publish a tag that disagrees with package.json, which is the
      # easiest way to ship 0.4.0 under the v0.4.1 tag and never notice.
      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # Trusted publishing needs npm >= 11.5.1 and `npm stage` a later 11.x; pinned to
      # the line this was verified with rather than whatever the runner's Node ships.
      - run: npm install -g npm@11.17.0

      # No NODE_AUTH_TOKEN, on purpose: with a token in the environment npm
      # authenticated with it instead of OIDC, and a token cannot satisfy 2FA.
      - run: npm stage publish . --provenance --access public
